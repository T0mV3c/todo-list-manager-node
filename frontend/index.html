<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&family=Lexend:wght@100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <title>ToDo List Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="titolo-tema">
  <h1>ToDo List Manager</h1>
  <button id="theme-toggle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="40px" height="40px"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="var(--menu)" d="M320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576C388.8 576 451.3 548.8 497.3 504.6C504.6 497.6 506.7 486.7 502.6 477.5C498.5 468.3 488.9 462.6 478.8 463.4C473.9 463.8 469 464 464 464C362.4 464 280 381.6 280 280C280 207.9 321.5 145.4 382.1 115.2C391.2 110.7 396.4 100.9 395.2 90.8C394 80.7 386.6 72.5 376.7 70.3C358.4 66.2 339.4 64 320 64z"/></svg></button>
  </div>

  <div id="background-scuro"></div>
  
  <section>
      <button id="creazioneLista" onclick="toggleForm()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20px" height="20px"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="rgb(164, 255, 155)" d="M352 128C352 110.3 337.7 96 320 96C302.3 96 288 110.3 288 128L288 288L128 288C110.3 288 96 302.3 96 320C96 337.7 110.3 352 128 352L288 352L288 512C288 529.7 302.3 544 320 544C337.7 544 352 529.7 352 512L352 352L512 352C529.7 352 544 337.7 544 320C544 302.3 529.7 288 512 288L352 288L352 128z"/></svg></button>
      <div id="containerForm">

        <div id="formTitolo">
          <p>Titolo*</p>
          <input type="text" id="titoloLista" placeholder="Titolo*">
        </div>

        <div id="formDescrizione">
          <p>Descrizione</p>
          <input type="text" id="descrizioneLista" placeholder="Descrizione (opzionale)">
        </div>

        <div id="div-post-lista">
          <button id="post-lista"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="40px" height="40px"><path fill="rgb(17, 196, 0)" d="M160 96C124.7 96 96 124.7 96 160L96 480C96 515.3 124.7 544 160 544L480 544C515.3 544 544 515.3 544 480L544 160C544 124.7 515.3 96 480 96L160 96zM296 408L296 344L232 344C218.7 344 208 333.3 208 320C208 306.7 218.7 296 232 296L296 296L296 232C296 218.7 306.7 208 320 208C333.3 208 344 218.7 344 232L344 296L408 296C421.3 296 432 306.7 432 320C432 333.3 421.3 344 408 344L344 344L344 408C344 421.3 333.3 432 320 432C306.7 432 296 421.3 296 408z"/></svg></button>
        </div>
        
      </div>
    </section>

      
    <div id="containerUpdateForm">

      <div id="formUpdateTitolo">
        <p>Modifica Titolo*</p>
        <input type="text" id="titoloUpdateLista" placeholder="Nuovo Titolo*">
      </div>

      <div id="formUpdateDescrizione">
        <p>Modifica Descrizione</p>
        <input type="text" id="descrizioneUpdateLista" placeholder="Nuova Descrizione (opzionale)">
      </div>

      <div id="div-update-lista">
        <button id="update-lista"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="30px" height="30px"><path fill="rgb(17, 196, 0)" d="M530.8 134.1C545.1 144.5 548.3 164.5 537.9 178.8L281.9 530.8C276.4 538.4 267.9 543.1 258.5 543.9C249.1 544.7 240 541.2 233.4 534.6L105.4 406.6C92.9 394.1 92.9 373.8 105.4 361.3C117.9 348.8 138.2 348.8 150.7 361.3L252.2 462.8L486.2 141.1C496.6 126.8 516.6 123.6 530.9 134z"/></svg></button>
      </div>
        
    </div>

  <div id="elenco-liste">
    
  </div>

  <script src="api.js"></script>
  <script src="main.js"></script>
</body>
</html>
